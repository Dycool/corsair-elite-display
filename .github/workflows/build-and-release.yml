name: Build and draft release

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Run tests
        run: cargo test --locked
      - name: Build release executable
        run: cargo build --release --locked
      - name: Upload Windows executable
        uses: actions/upload-artifact@v7
        with:
          name: corsair-elite-display-windows-x64
          path: target/release/corsair-elite-display.exe
          if-no-files-found: error

  release:
    name: Create draft GitHub release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: corsair-elite-display-windows-x64
          path: release-assets
      - name: Create release ZIP
        shell: pwsh
        run: Compress-Archive -Path release-assets/corsair-elite-display.exe -DestinationPath release-assets/corsair-elite-display-windows-x64.zip -Force
      - name: Create draft release from tag
        uses: softprops/action-gh-release@v3
        with:
          draft: true
          generate_release_notes: true
          files: |
            release-assets/corsair-elite-display.exe
            release-assets/corsair-elite-display-windows-x64.zip
          fail_on_unmatched_files: true
