[package]
name = "corsair-elite-display"
version = "1.0.0"
edition = "2024"
authors = ["Diogo"]
description = "A lightweight Windows tray app that turns a Corsair Elite LCD into a real second display"
license = "MIT"
repository = "https://github.com/Dycool/corsair-elite-display"
readme = "README.md"

[dependencies]
image = { version = "0.25.10", default-features = false, features = ["jpeg", "png", "gif", "bmp"] }
windows-sys = { version = "0.61.2", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_Media",
    "Win32_Storage_FileSystem",
    "Win32_Security",
    "Win32_System_LibraryLoader",
    "Win32_System_Registry",
    "Win32_System_StationsAndDesktops",
    "Win32_System_Threading",
    "Win32_UI_Shell",
    "Win32_UI_Controls",
    "Win32_UI_Controls_Dialogs",
    "Win32_UI_WindowsAndMessaging",
] }

[build-dependencies]
winresource = "0.1"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true
